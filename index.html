<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <button id="darkModeToggle" class="dark-mode-btn">🌙</button>
        </header>

        <!-- Summary -->
        <div class="summary">
            <div class="card balance">
                <span class="label">Saldo Saat Ini</span>
                <h2 id="balance">Rp 0</h2>
            </div>
            <div class="summary-row">
                <div class="card income">
                    <span class="label">Pemasukan</span>
                    <h2 id="income">Rp 0</h2>
                </div>
                <div class="card expense">
                    <span class="label">Pengeluaran</span>
                    <h2 id="expense">Rp 0</h2>
                </div>
            </div>
        </div>

        <!-- Form -->
        <form id="transactionForm">
            <h3 id="formTitle">Tambah Transaksi</h3>
            
            <input type="text" id="description" placeholder="Keterangan..." required>

            <div class="form-row">
                <input type="number" id="amount" placeholder="Jumlah" min="1" required>
                <select id="type" required>
                    <option value="income">Pemasukan</option>
                    <option value="expense" selected>Pengeluaran</option>
                </select>
            </div>

            <div class="form-row">
                <select id="category" required>
                    <option value="Gaji">Gaji</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Transport">Transport</option>
                    <option value="Belanja">Belanja</option>
                    <option value="Tagihan">Tagihan</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Kesehatan">Kesehatan</option>
                    <option value="Pendidikan">Pendidikan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
                <input type="date" id="dateInput" required>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn">+ Tambah</button>
                <button type="button" id="cancelEditBtn" class="cancel-btn hidden">Batal</button>
            </div>
        </form>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="income">Masuk</button>
                <button class="filter-btn" data-filter="expense">Keluar</button>
            </div>
            <input type="text" id="searchInput" placeholder="Cari transaksi...">
        </div>

        <!-- List -->
        <div class="transactions">
            <div class="transactions-header">
                <h3>Riwayat Transaksi</h3>
                <span id="transactionCount">0 transaksi</span>
            </div>
            <ul id="transactionList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
